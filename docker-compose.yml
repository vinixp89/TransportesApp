services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transportesapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: TransportesApp.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=transportesapp_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TransportesApp
      Jwt__Audience: TransportesApp
      GoogleMaps__ApiKey: ${GOOGLEMAPS_APIKEY}
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESSTOKEN}
      MercadoPago__UrlRetornoFrontend: ${FRONTEND_URL}
      MercadoPago__UrlNotificacao: ${MERCADOPAGO_NOTIFICACAO_URL}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
    # Publicado direto no IP (porta 8080) enquanto não tem domínio configurado — depois que tiver
    # um domínio apontando pro servidor, pode trocar isso de volta pra "expose" e usar só o Caddy
    # (HTTPS) como porta de entrada, já que ele já reverse-proxya pra api:8080 mesmo assim.
    ports:
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
