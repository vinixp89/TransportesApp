services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transportesapp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: TransportesApp.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=transportesapp_db;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: TransportesApp
      Jwt__Audience: TransportesApp
      GoogleMaps__ApiKey: ${GOOGLEMAPS_APIKEY}
      MercadoPago__AccessToken: ${MERCADOPAGO_ACCESSTOKEN}
      MercadoPago__UrlRetornoFrontend: ${FRONTEND_URL}
      MercadoPago__UrlNotificacao: ${MERCADOPAGO_NOTIFICACAO_URL}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: ${FRONTEND_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
      Smtp__EnableSsl: ${SMTP_ENABLESSL}
      Inter__Ambiente: ${INTER_AMBIENTE}
      Inter__ClientId: ${INTER_CLIENT_ID}
      Inter__ClientSecret: ${INTER_CLIENT_SECRET}
      Inter__CertificadoPath: /app/inter-certs/certificado.crt
      Inter__ChavePath: /app/inter-certs/chave.key
      Inter__ContaCorrente: ${INTER_CONTA_CORRENTE}
    # Só interna à rede do Docker agora que o Caddy (HTTPS) é a porta de entrada pública — o
    # tráfego chega em api:8080 via reverse_proxy do Caddy, não precisa mais expor direto.
    expose:
      - "8080"
    volumes:
      # Fotos de verificação dos motoristas (selfie, veículo, placa — ver MotoristasController) —
      # sem isso, um "docker compose up --build" apaga tudo que foi enviado, porque o container é
      # recriado do zero a cada deploy.
      - motorista_uploads:/app/uploads
      # Certificado mTLS da API do Banco Inter (ver InterPagamentoGateway) — arquivos ficam direto no
      # servidor, em ./inter-certs/certificado.crt e ./inter-certs/chave.key, NUNCA no repositório
      # (está no .gitignore). Bind mount somente leitura porque o container nunca precisa escrever ali.
      - ./inter-certs:/app/inter-certs:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  motorista_uploads:
